name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # Bilgi tabanı (ofsng/teknoloji) yalnızca okunur; .kb/ altına sığ klonlanır.
      - run: npm run data
        env:
          KB_STRICT: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
